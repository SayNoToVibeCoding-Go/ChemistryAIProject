<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqueous Ion Colors Experiment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
        }

        /* Smooth transition for the liquid in the flask */
        #liquid {
            transition: fill 0.8s ease-in-out;
        }

        .flask-container {
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.1));
        }

        .btn-ion {
            transition: all 0.2s;
        }
        
        .btn-ion:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .btn-ion:active {
            transform: translateY(0);
        }

        /* Hide elements utility */
        .hidden-section {
            display: none !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Bar -->
    <header class="bg-white shadow-sm px-6 py-4 flex items-center justify-between border-b border-slate-200">
        <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
            <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            Ion Color Lab
        </h1>
        <a href="index.html" class="inline-flex items-center px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-sm font-medium rounded-lg transition-colors">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Return to Home Page
        </a>
    </header>

    <main class="flex-grow flex flex-col items-center p-6 w-full max-w-6xl mx-auto">
        
        <!-- EXPERIMENT SECTION -->
        <div id="experiment-section" class="w-full flex flex-col items-center animate-fade-in">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-slate-800 mb-3">Transition Metal Ions in Aqueous Solution</h2>
                <p class="text-slate-500 max-w-2xl mx-auto">Select an ion to add to the water and observe the characteristic color change of the resulting aqueous complex.</p>
            </div>

            <div class="flex flex-col md:flex-row gap-12 items-center w-full justify-center mb-10">
                
                <!-- Flask Visual -->
                <div class="relative flask-container bg-white p-8 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center w-full md:w-1/3">
                    <svg width="200" height="250" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
                        <!-- Liquid shape (changes color) -->
                        <path id="liquid" d="M70,120 L50,180 A 50 50 0 0 0 150 180 L130,120 Z" fill="#e0f2fe" />
                        <!-- Liquid Top Surface -->
                        <ellipse id="liquid-surface" cx="100" cy="120" rx="30" ry="8" fill="rgba(255,255,255,0.3)" />
                        
                        <!-- Flask Outline (Glass) -->
                        <path d="M85,20 L85,90 L40,200 A 65 65 0 0 0 160 200 L115,90 L115,20 Z" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                        <line x1="75" y1="20" x2="125" y2="20" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
                        
                        <!-- Measurement lines -->
                        <line x1="80" y1="130" x2="95" y2="130" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
                        <line x1="70" y1="160" x2="90" y2="160" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
                        
                        <!-- Glass reflection -->
                        <path d="M145,190 A 50 50 0 0 0 110,100" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round"/>
                    </svg>

                    <div class="mt-6 text-center h-16">
                        <p class="text-sm font-semibold text-slate-400 uppercase tracking-wide">Current Ion</p>
                        <p id="current-ion-display" class="text-2xl font-bold text-slate-800">Water (H₂O)</p>
                    </div>
                </div>

                <!-- Ion Controls -->
                <div class="w-full md:w-2/3 grid grid-cols-2 sm:grid-cols-3 gap-3">
                    <!-- Buttons will be injected here via JS -->
                    <div id="ion-buttons-container" class="contents"></div>
                </div>
            </div>

            <!-- Action to go to Test -->
            <button onclick="startTest()" class="mt-4 px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-bold rounded-xl shadow-lg shadow-indigo-200 transition-all hover:-translate-y-1 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                Test Your Knowledge
            </button>
        </div>

        <!-- TEST SECTION -->
        <div id="test-section" class="w-full max-w-3xl flex-col items-center hidden-section animate-fade-in mt-8">
            <div class="w-full flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Knowledge Check</h2>
                <button onclick="endTest()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-semibold transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Back to Experiment
                </button>
            </div>

            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 w-full text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-indigo-100">
                    <div id="test-progress" class="h-full bg-indigo-600 w-0 transition-all duration-300"></div>
                </div>

                <h3 class="text-xl md:text-2xl font-medium text-slate-700 mt-4 mb-8 leading-relaxed">
                    What is going to be the colour change if <br>
                    <span id="question-ion" class="text-3xl font-extrabold text-indigo-700 block mt-3"></span>
                    <span class="text-lg">is added?</span>
                </h3>

                <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                    <!-- Options injected here -->
                </div>

                <div id="feedback-container" class="hidden-section flex flex-col items-center justify-center p-4 rounded-xl mb-4">
                    <p id="feedback-text" class="text-xl font-bold mb-4"></p>
                    <button onclick="nextQuestion()" class="px-6 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg transition-colors">
                        Next Question
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // Data Structure for Ions
        const ionsData = [
            { id: 'co2', name: 'Cobalt(II)', formula: 'Co<sup>2+</sup>', colorName: 'pink-red', hex: '#fb7185' },
            { id: 'fe3', name: 'Iron(III)', formula: 'Fe<sup>3+</sup>', colorName: 'yellow', hex: '#fcd34d' },
            { id: 'cro4', name: 'Chromate', formula: 'CrO<sub>4</sub><sup>2-</sup>', colorName: 'yellow', hex: '#fbbf24' },
            { id: 'cr2o7', name: 'Dichromate', formula: 'Cr<sub>2</sub>O<sub>7</sub><sup>2-</sup>', colorName: 'orange', hex: '#f97316' },
            { id: 'fe2', name: 'Iron(II)', formula: 'Fe<sup>2+</sup>', colorName: 'pale green', hex: '#86efac' },
            { id: 'ni2', name: 'Nickel(II)', formula: 'Ni<sup>2+</sup>', colorName: 'green', hex: '#22c55e' },
            { id: 'cr3', name: 'Chromium(III)', formula: 'Cr<sup>3+</sup>', colorName: 'green', hex: '#16a34a' },
            { id: 'cu2', name: 'Copper(II)', formula: 'Cu<sup>2+</sup>', colorName: 'blue', hex: '#3b82f6' },
            { id: 'mno4', name: 'Permanganate', formula: 'MnO<sub>4</sub><sup>-</sup>', colorName: 'purple-violet', hex: '#9333ea' },
            { id: 'ti3', name: 'Titanium(III)', formula: 'Ti<sup>3+</sup>', colorName: 'purple-violet', hex: '#a855f7' }
        ];

        const uniqueColors = [...new Set(ionsData.map(ion => ion.colorName))];

        // --- EXPERIMENT LOGIC ---
        const buttonsContainer = document.getElementById('ion-buttons-container');
        const liquidPath = document.getElementById('liquid');
        const liquidSurface = document.getElementById('liquid-surface');
        const currentIonDisplay = document.getElementById('current-ion-display');

        function initExperiment() {
            ionsData.forEach(ion => {
                const btn = document.createElement('button');
                btn.className = 'btn-ion bg-white border border-slate-200 hover:border-indigo-300 rounded-xl p-4 text-center flex flex-col items-center justify-center gap-1 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2';
                btn.innerHTML = `
                    <span class="text-sm text-slate-500 font-medium">${ion.name}</span>
                    <span class="text-lg font-bold text-slate-800">${ion.formula}</span>
                `;
                btn.onclick = () => updateFlask(ion);
                buttonsContainer.appendChild(btn);
            });

            // Add a reset/water button
            const resetBtn = document.createElement('button');
            resetBtn.className = 'btn-ion bg-slate-50 border border-slate-200 hover:border-blue-300 rounded-xl p-4 text-center flex flex-col items-center justify-center gap-1 focus:outline-none focus:ring-2 focus:ring-blue-500 col-span-full sm:col-span-1';
            resetBtn.innerHTML = `
                <span class="text-sm text-slate-500 font-medium">Reset</span>
                <span class="text-lg font-bold text-slate-800">Water</span>
            `;
            resetBtn.onclick = () => {
                liquidPath.setAttribute('fill', '#e0f2fe');
                currentIonDisplay.innerHTML = 'Water (H₂O)';
            };
            buttonsContainer.appendChild(resetBtn);
        }

        function updateFlask(ion) {
            liquidPath.setAttribute('fill', ion.hex);
            currentIonDisplay.innerHTML = `${ion.name} (${ion.formula})`;
        }

        // --- TEST LOGIC ---
        const expSection = document.getElementById('experiment-section');
        const testSection = document.getElementById('test-section');
        const questionIonEl = document.getElementById('question-ion');
        const optionsContainer = document.getElementById('options-container');
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackText = document.getElementById('feedback-text');
        
        let currentQuestionIon = null;
        let score = 0;
        let questionsAsked = 0;

        function startTest() {
            expSection.classList.add('hidden-section');
            testSection.classList.remove('hidden-section');
            testSection.classList.add('flex');
            score = 0;
            questionsAsked = 0;
            document.getElementById('test-progress').style.width = '0%';
            nextQuestion();
        }

        function endTest() {
            testSection.classList.add('hidden-section');
            testSection.classList.remove('flex');
            expSection.classList.remove('hidden-section');
        }

        function nextQuestion() {
            // Reset UI
            feedbackContainer.classList.add('hidden-section');
            optionsContainer.classList.remove('hidden-section');
            optionsContainer.innerHTML = '';

            // Pick a random ion
            currentQuestionIon = ionsData[Math.floor(Math.random() * ionsData.length)];
            
            // Set question text
            questionIonEl.innerHTML = `${currentQuestionIon.name} (${currentQuestionIon.formula})`;

            // Generate Options (1 correct, 3 random wrong)
            const correctAnswer = currentQuestionIon.colorName;
            let options = [correctAnswer];
            
            let availableWrong = uniqueColors.filter(c => c !== correctAnswer);
            // Shuffle and pick 3
            availableWrong.sort(() => 0.5 - Math.random());
            options.push(availableWrong[0], availableWrong[1], availableWrong[2]);
            
            // Shuffle final options
            options.sort(() => 0.5 - Math.random());

            // Create buttons
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'py-4 px-6 border-2 border-slate-200 rounded-xl text-lg font-bold text-slate-700 hover:border-indigo-400 hover:bg-indigo-50 transition-colors focus:outline-none capitalize';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedColor, btnElement) {
            // Disable all buttons
            const allBtns = optionsContainer.querySelectorAll('button');
            allBtns.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50');
            });

            questionsAsked++;
            document.getElementById('test-progress').style.width = `${Math.min((questionsAsked / 10) * 100, 100)}%`;

            optionsContainer.classList.add('hidden-section');
            feedbackContainer.classList.remove('hidden-section');

            if (selectedColor === currentQuestionIon.colorName) {
                // Correct
                score++;
                feedbackContainer.className = 'flex flex-col items-center justify-center p-8 rounded-xl mb-4 bg-green-50 border border-green-200 w-full';
                feedbackText.innerHTML = `
                    <span class="text-green-600 block text-2xl mb-2">✓ Correct!</span>
                    <span class="text-slate-700 text-base font-normal">${currentQuestionIon.name} turns the solution <strong class="capitalize">${currentQuestionIon.colorName}</strong>.</span>
                `;
            } else {
                // Wrong
                feedbackContainer.className = 'flex flex-col items-center justify-center p-8 rounded-xl mb-4 bg-red-50 border border-red-200 w-full';
                feedbackText.innerHTML = `
                    <span class="text-red-600 block text-2xl mb-2">✗ Incorrect</span>
                    <span class="text-slate-700 text-base font-normal">You chose <em>${selectedColor}</em>. <br>The correct color for ${currentQuestionIon.name} is <strong class="capitalize">${currentQuestionIon.colorName}</strong>.</span>
                `;
            }
        }

        // Initialize on load
        window.onload = initExperiment;

    </script>
</body>
</html>
