<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crude Oil Fractionating Tower</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc; /* slate-50 */
            overflow-x: hidden;
        }

        /* Custom scrollbar for info panel */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4); 
        }

        /* Tower Animations */
        .fraction-layer {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
        }
        
        .fraction-layer::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .fraction-layer:hover {
            transform: scale(1.02) translateX(10px);
            box-shadow: -5px 5px 20px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .fraction-layer:hover::after {
            opacity: 1;
        }

        .fraction-layer.active {
            transform: scale(1.05) translateX(15px);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
            z-index: 20;
            border: 2px solid white;
        }

        /* Vapor Bubbles Animation */
        @keyframes rise {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-50px) scale(1.2); opacity: 0; }
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            animation: rise 3s infinite ease-in;
        }

        /* Connecting pipes */
        .pipe-out {
            position: absolute;
            right: -40px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 12px;
            background-color: inherit;
            border: 2px solid #334155;
            border-left: none;
            z-index: -1;
            transition: all 0.3s ease;
        }
        
        .fraction-layer:hover .pipe-out, .fraction-layer.active .pipe-out {
            width: 60px;
            right: -60px;
        }

        /* Info panel fade in */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* Furnace Animation */
        @keyframes heatGlow {
            0% { filter: brightness(1) drop-shadow(0 0 5px rgba(239, 68, 68, 0.4)); }
            50% { filter: brightness(1.4) drop-shadow(0 0 25px rgba(239, 68, 68, 1)); }
            100% { filter: brightness(1) drop-shadow(0 0 5px rgba(239, 68, 68, 0.4)); }
        }
        .furnace-glow {
            animation: heatGlow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row overflow-hidden bg-slate-900">
<a href="index.html" class="fixed top-6 left-6 z-50 flex items-center gap-2 px-5 py-2.5 bg-slate-800/60 backdrop-blur-md border border-cyan-500/30 rounded-xl text-cyan-400 font-semibold hover:bg-cyan-900/40 hover:border-cyan-400 hover:shadow-[0_0_15px_rgba(34,211,238,0.4)] transition-all duration-300 cursor-pointer">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
  </svg>
  Return to Menu
</a> 
    <!-- Left Column: The Tower -->
    <div id="tower-section" class="w-full p-2 md:p-8 flex items-center justify-center relative min-h-[60vh] md:min-h-screen bg-slate-900 shadow-2xl z-10 transition-all duration-500 ease-in-out overflow-x-auto">
        
        <!-- Background decorative elements -->
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none opacity-20">
            <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-blue-500 rounded-full mix-blend-screen filter blur-[100px]"></div>
            <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-orange-600 rounded-full mix-blend-screen filter blur-[120px]"></div>
        </div>

        <!-- Assembly Container (Furnace + Tower) -->
        <div class="flex items-end justify-center relative mt-10 md:mt-0">
            
            <!-- Crude Oil Inlet (Completely Outside) -->
            <div class="flex items-center z-0 mb-12">
                <div class="hidden md:block text-right mr-3 bg-slate-800/80 p-2 rounded-lg backdrop-blur-sm border border-slate-700 shadow-lg">
                    <div class="font-bold text-orange-400 whitespace-nowrap">Crude Oil</div>
                    <div class="text-xs text-slate-300 whitespace-nowrap">Heated to >600°C</div>
                </div>
                <div class="w-20 md:w-32 h-20 md:h-28 bg-slate-700 border-4 border-slate-600 relative overflow-hidden rounded-lg flex items-center justify-center furnace-glow shadow-[0_0_40px_rgba(239,68,68,0.4)]">
                    <!-- Inlet heat animation -->
                    <div class="absolute inset-0 bg-gradient-to-r from-slate-900 via-red-900 to-orange-500 opacity-90"></div>
                    <svg class="w-8 h-8 md:w-12 md:h-12 text-yellow-300 z-10 animate-pulse drop-shadow-[0_0_12px_rgba(253,224,71,0.9)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.879 16.121A3 3 0 1012.015 11L11 14H9c0 .768.293 1.536.879 2.121z"></path></svg>
                    <!-- bubbles -->
                    <div class="bubble" style="width: 10px; height: 10px; left: 20%; animation-duration: 1.5s;"></div>
                    <div class="bubble" style="width: 14px; height: 14px; left: 50%; animation-duration: 2s; animation-delay: 0.5s;"></div>
                    <div class="bubble" style="width: 12px; height: 12px; left: 70%; animation-duration: 1.8s; animation-delay: 0.2s;"></div>
                </div>
                <!-- Connecting Pipe entirely outside main tower body -->
                <div class="w-12 md:w-24 h-10 md:h-12 bg-gradient-to-r from-orange-600 to-slate-700 border-y-4 border-slate-600 relative overflow-hidden flex items-center z-0 -mr-1">
                    <!-- Flow animation inside pipe -->
                    <div class="w-full h-full bg-white/20 animate-pulse"></div>
                </div>
            </div>

            <div class="relative w-40 md:w-64 h-[65vh] md:h-[85vh] max-h-[800px] z-10">
                <!-- Temperature Scale (Left) -->
                <div class="absolute -left-10 md:-left-16 top-0 bottom-0 flex flex-col justify-between text-[10px] md:text-sm text-slate-400 py-4 font-mono z-20 pointer-events-none">
                    <span>25°C</span>
                    <span>Cooler</span>
                    <div class="h-full w-px bg-gradient-to-b from-blue-400 via-orange-400 to-red-600 mx-auto my-2"></div>
                    <span>Hotter</span>
                    <span>>600°C</span>
                </div>

                <!-- Main Tower Container -->
                <div id="tower-container" class="w-full h-full border-4 border-slate-700 rounded-t-full rounded-b-xl flex flex-col overflow-hidden bg-slate-800 shadow-[0_0_50px_rgba(0,0,0,0.5)] relative z-10">
                    <!-- Javascript will populate the fractions here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Right Column: Information Panel (Hidden initially) -->
    <div id="info-section" class="w-0 md:w-0 overflow-hidden transition-all duration-500 ease-in-out flex flex-col justify-center relative bg-slate-900 bg-opacity-95 border-l border-slate-800 opacity-0">
        
        <div id="info-panel" class="flex flex-col h-full justify-center w-full min-w-[320px] p-6 md:p-12">
            <button id="close-btn" class="absolute top-6 right-6 p-2 rounded-full bg-slate-800 hover:bg-slate-700 border border-slate-600 transition-colors text-slate-400 hover:text-white z-50 shadow-lg">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <div id="info-content" class="w-full max-w-lg mx-auto">
                <!-- Content will be injected here via JS -->
            </div>
        </div>
    </div>

    <script>
        // Data for fractions (Ordered from top to bottom)
        const fractionsData = [
            { 
                id: "gas", 
                name: "Refinery Gas", 
                temp: "< 40°C", 
                uses: ["Bottled gas", "Heating"], 
                example: { name: "Propane", formula: "C₃H₈", mass: "44.1 g/mol", structure: "CH₃-CH₂-CH₃" },
                color: "#fef08a", 
                textColor: "#422006"
            },
            { 
                id: "petrol", 
                name: "Petrol", 
                temp: "40°C - 90°C", 
                uses: ["Fuel for cars"], 
                example: { name: "Octane", formula: "C₈H₁₈", mass: "114.2 g/mol", structure: "CH₃-(CH₂)₆-CH₃" },
                color: "#fde047", 
                textColor: "#422006"
            },
            { 
                id: "naphtha", 
                name: "Naphtha", 
                temp: "90°C - 175°C", 
                uses: ["Making chemicals", "Plastics"], 
                example: { name: "Hexane", formula: "C₆H₁₄", mass: "86.2 g/mol", structure: "CH₃-(CH₂)₄-CH₃" },
                color: "#fcd34d", 
                textColor: "#451a03"
            },
            { 
                id: "kerosine", 
                name: "Kerosine", 
                temp: "175°C - 325°C", 
                uses: ["Aircraft fuel"], 
                example: { name: "Dodecane", formula: "C₁₂H₂₆", mass: "170.3 g/mol", structure: "CH₃-(CH₂)₁₀-CH₃" },
                color: "#fbbf24", 
                textColor: "#451a03"
            },
            { 
                id: "diesel", 
                name: "Diesel", 
                temp: "250°C - 350°C", 
                uses: ["Fuel for trains", "Heavy vehicles"], 
                example: { name: "Hexadecane", formula: "C₁₆H₃₄", mass: "226.4 g/mol", structure: "CH₃-(CH₂)₁₄-CH₃" },
                color: "#f97316", 
                textColor: "#fff"
            },
            { 
                id: "lubricating_oil", 
                name: "Lubricating Oil", 
                temp: "300°C - 370°C", 
                uses: ["Motor oil", "Waxes", "Polishes"], 
                example: { name: "Eicosane", formula: "C₂₀H₄₂", mass: "282.5 g/mol", structure: "CH₃-(CH₂)₁₈-CH₃" },
                color: "#ea580c", 
                textColor: "#fff"
            },
            { 
                id: "fuel_oil", 
                name: "Fuel Oil", 
                temp: "370°C - 600°C", 
                uses: ["Fuel for ships", "Power stations"], 
                example: { name: "Tetracosane", formula: "C₂₄H₅₀", mass: "338.7 g/mol", structure: "CH₃-(CH₂)₂₂-CH₃" },
                color: "#9a3412", 
                textColor: "#fff"
            },
            { 
                id: "residue", 
                name: "Residue", 
                temp: "> 600°C", 
                uses: ["Bitumen for roads", "Roofing"], 
                example: { name: "Asphaltene", formula: "Complex polycyclic", mass: "> 500 g/mol", structure: "Complex aromatic rings" },
                color: "#000000", 
                textColor: "#fff"
            }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const towerContainer = document.getElementById("tower-container");
            const towerSection = document.getElementById("tower-section");
            const infoSection = document.getElementById("info-section");
            const infoPanel = document.getElementById("info-panel");
            const infoContent = document.getElementById("info-content");
            const closeBtn = document.getElementById("close-btn");

            let activeElement = null;

            // Generate tower layers
            fractionsData.forEach((fraction, index) => {
                // Calculate height percentage based on index to make top layers slightly larger visually if desired, 
                // but equal flex works best for a standard diagram.
                
                const layer = document.createElement("div");
                layer.className = `fraction-layer flex-1 flex flex-col justify-center items-center relative overflow-hidden group border-b border-opacity-20 border-black`;
                layer.style.backgroundColor = fraction.color;
                layer.style.color = fraction.textColor;
                layer.dataset.id = fraction.id;

                // Add text content inside layer
                layer.innerHTML = `
                    <div class="pipe-out rounded-r flex items-center justify-end pr-2 text-[10px] font-bold shadow-lg" style="color: ${fraction.textColor}">
                        ▶
                    </div>
                    <span class="font-bold text-sm md:text-lg tracking-wide z-10 text-center px-2 pointer-events-none drop-shadow-md">
                        ${fraction.name}
                    </span>
                    <span class="text-xs md:text-sm opacity-80 z-10 pointer-events-none mt-1 font-mono">
                        ${fraction.temp}
                    </span>
                `;

                // Add bubbling effect for lighter fractions (top half)
                if (index < 4) {
                    for(let i=0; i<3; i++) {
                        const bubble = document.createElement("div");
                        bubble.className = "bubble";
                        const size = Math.random() * 10 + 5;
                        bubble.style.width = `${size}px`;
                        bubble.style.height = `${size}px`;
                        bubble.style.left = `${Math.random() * 80 + 10}%`;
                        bubble.style.bottom = `${Math.random() * 20}%`;
                        bubble.style.animationDuration = `${Math.random() * 2 + 2}s`;
                        bubble.style.animationDelay = `${Math.random() * 2}s`;
                        layer.appendChild(bubble);
                    }
                }

                // Click event to show info
                layer.addEventListener("click", () => {
                    // Handle active class
                    if (activeElement) {
                        activeElement.classList.remove("active");
                    }
                    layer.classList.add("active");
                    activeElement = layer;

                    // Update and show info panel
                    showInfo(fraction);
                });

                towerContainer.appendChild(layer);
            });

            closeBtn.addEventListener("click", () => {
                // Hide info panel and restore tower full width
                infoSection.classList.remove("w-full", "md:w-1/2", "opacity-100");
                infoSection.classList.add("w-0", "md:w-0", "opacity-0");
                
                towerSection.classList.remove("md:w-1/2");
                towerSection.classList.add("w-full");

                if (activeElement) {
                    activeElement.classList.remove("active");
                    activeElement = null;
                }
            });

            function showInfo(fraction) {
                // Open side panel with smooth transition
                towerSection.classList.remove("w-full");
                towerSection.classList.add("md:w-1/2");
                
                infoSection.classList.remove("w-0", "md:w-0", "opacity-0");
                infoSection.classList.add("w-full", "md:w-1/2", "opacity-100");
                
                // Clear old content to trigger reflow and animation
                infoContent.innerHTML = '';
                infoContent.classList.remove('fade-in');
                
                // Small timeout to allow browser to register class removal
                setTimeout(() => {
                    let usesHtml = fraction.uses.map(use => `<li class="flex items-start mb-2">
                        <svg class="w-5 h-5 text-emerald-400 mr-2 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span>${use}</span>
                    </li>`).join('');

                    infoContent.innerHTML = `
                        <h2 class="text-4xl md:text-5xl font-bold mb-2 text-white capitalize tracking-tight">${fraction.name}</h2>
                        
                        <div class="flex items-center text-orange-400 mb-8 font-mono text-lg">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                            Boiling Range: ${fraction.temp}
                        </div>

                        <div class="bg-slate-800 bg-opacity-70 p-6 rounded-2xl border border-slate-700 shadow-xl mb-8">
                            <h3 class="text-sm uppercase tracking-widest text-blue-400 font-bold mb-4 flex items-center">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                                Example Product
                            </h3>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4 border-b border-slate-700 pb-4">
                                <div>
                                    <span class="text-slate-400 text-xs uppercase tracking-wider block mb-1">Name</span>
                                    <span class="text-white font-semibold text-lg">${fraction.example.name}</span>
                                </div>
                                <div>
                                    <span class="text-slate-400 text-xs uppercase tracking-wider block mb-1">Formula</span>
                                    <span class="text-emerald-400 font-mono font-semibold text-lg">${fraction.example.formula}</span>
                                </div>
                                <div>
                                    <span class="text-slate-400 text-xs uppercase tracking-wider block mb-1">Molar Mass</span>
                                    <span class="text-orange-300 font-mono text-base">${fraction.example.mass}</span>
                                </div>
                            </div>
                            
                            <div class="mt-4">
                                <span class="text-slate-400 text-xs uppercase tracking-wider block mb-2">Chemical Structure</span>
                                <div class="bg-slate-900 p-4 rounded text-center font-mono text-blue-300 tracking-widest overflow-x-auto text-sm md:text-base border border-slate-800 shadow-inner">
                                    ${fraction.example.structure}
                                </div>
                            </div>
                        </div>

                        <div>
                            <h3 class="text-xl font-semibold mb-4 text-white border-b border-slate-700 pb-2">Common Uses</h3>
                            <ul class="text-slate-300 text-lg space-y-3">
                                ${usesHtml}
                            </ul>
                        </div>
                    `;
                    infoContent.classList.add('fade-in');
                    
                    // On mobile, scroll down to the info panel
                    if (window.innerWidth < 768) {
                        setTimeout(() => {
                            infoSection.scrollIntoView({ behavior: 'smooth' });
                        }, 300);
                    }
                }, 50);
            }
        });
    </script>
</body>
</html>
